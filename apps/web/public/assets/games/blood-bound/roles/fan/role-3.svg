<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <radialGradient id="fan-har-bg" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="60%" stop-color="#022c22"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
    <filter id="fan-har-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#10b981" flood-opacity="0.6"/>
    </filter>
  </defs>

  <circle cx="64" cy="64" r="60" fill="url(#fan-har-bg)" stroke="#10b981" stroke-width="3" filter="url(#fan-har-glow)"/>
  <circle cx="64" cy="64" r="54" fill="none" stroke="rgba(52, 211, 153, 0.35)" stroke-width="1.2" stroke-dasharray="3 3"/>

  <!-- Mũ hề xanh ngọc bích 2 sừng uốn lượn -->
  <path d="M 64 36 C 44 26 24 16 16 36 C 24 44 38 42 48 48 Z" fill="#047857" stroke="#022c22" stroke-width="1.5"/>
  <circle cx="16" cy="36" r="4" fill="#6ee7b7" stroke="#d1fae5" stroke-width="1"/>
  <path d="M 64 36 C 84 26 104 16 112 36 C 104 44 90 42 80 48 Z" fill="#059669" stroke="#022c22" stroke-width="1.5"/>
  <circle cx="112" cy="36" r="4" fill="#6ee7b7" stroke="#d1fae5" stroke-width="1"/>

  <!-- Cổ áo xếp nếp dạ hội xanh lục -->
  <path d="M 32 128 L 48 88 L 64 96 L 80 88 L 96 128 Z" fill="#021c15" stroke="#047857" stroke-width="1.5"/>
  <polygon points="64,92 56,104 72,104" fill="#10b981"/>

  <!-- Mặt nạ dạ hội ngọc bích Jade Mask -->
  <path d="M 36 50 C 36 78 46 88 64 88 C 82 88 92 78 92 50 C 92 38 78 36 64 36 C 50 36 36 38 36 50 Z" 
        fill="#f0fdf4" stroke="#10b981" stroke-width="1.8"/>

  <!-- Họa tiết ngọc bích xẻ nửa mặt nạ -->
  <path d="M 36 50 C 36 78 46 88 64 88 L 64 36 C 50 36 36 38 36 50 Z" fill="#10b981" opacity="0.35"/>

  <!-- Hốc mắt ma mị sắc sảo -->
  <path d="M 44 56 Q 52 48 60 56 Q 52 62 44 56 Z" fill="#021c15"/>
  <ellipse cx="52" cy="56" rx="2.5" ry="1.5" fill="#34d399"/>
  <circle cx="53" cy="55.5" r="0.8" fill="#ffffff"/>

  <path d="M 68 56 Q 76 48 84 56 Q 76 62 68 56 Z" fill="#021c15"/>
  <ellipse cx="76" cy="56" rx="2.5" ry="1.5" fill="#34d399"/>
  <circle cx="77" cy="55.5" r="0.8" fill="#ffffff"/>

  <!-- Nụ cười bí hiểm giọt ngọc lục -->
  <path d="M 54 74 Q 64 80 74 74" fill="none" stroke="#059669" stroke-width="2" stroke-linecap="round"/>
  <circle cx="48" cy="68" r="2" fill="#10b981"/>

  <!-- Rank 3 Fan Clan -->
  <circle cx="64" cy="116" r="10" fill="#021c15" stroke="#10b981" stroke-width="1.5"/>
  <text x="64" y="120" text-anchor="middle" fill="#a7f3d0" font-size="11" font-weight="900" font-family="serif">III</text>
</svg>
