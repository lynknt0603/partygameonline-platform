<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <radialGradient id="fan-crt-bg" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="50%" stop-color="#022c22"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
    <linearGradient id="fan-silk" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a7f3d0"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#064e3b"/>
    </linearGradient>
    <filter id="fan-crt-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="5" flood-color="#10b981" flood-opacity="0.65"/>
    </filter>
  </defs>

  <circle cx="64" cy="64" r="60" fill="url(#fan-crt-bg)" stroke="#10b981" stroke-width="3" filter="url(#fan-crt-glow)"/>
  <circle cx="64" cy="64" r="54" fill="none" stroke="rgba(52, 211, 153, 0.35)" stroke-width="1.2" stroke-dasharray="3 3"/>

  <!-- Áo dạ hội lụa ngọc bích sẫm quý phái -->
  <path d="M 28 128 L 42 86 L 64 90 L 86 86 L 100 128 Z" fill="#021c15" stroke="#047857" stroke-width="1.5"/>

  <!-- Tóc bồng bềnh quý phái xanh rêu sẫm & trâm ngọc -->
  <path d="M 34 50 C 30 24 46 16 64 16 C 82 16 98 24 94 50 C 100 68 90 76 90 76 L 38 76 C 38 76 28 68 34 50 Z"
        fill="#064e3b" stroke="#10b981" stroke-width="1.5"/>
  <path d="M 46 48 C 46 66 52 74 64 78 C 76 74 82 66 82 48 C 82 38 76 34 64 34 C 52 34 46 38 46 48 Z"
        fill="#ecfdf5" stroke="#047857" stroke-width="1.2"/>

  <!-- Lông vũ kiêu sa cài tóc ngọc bích (Feather Plume) -->
  <path d="M 76 20 C 88 10 98 12 104 6 C 98 18 90 24 78 24 Z" fill="url(#fan-silk)" stroke="#a7f3d0" stroke-width="1"/>

  <!-- Mặt nạ dạ hội cánh quạt lụa xanh (Venetian Masquerade Mask) -->
  <path d="M 42 46 C 42 38 52 38 60 44 C 64 47 64 47 68 44 C 76 38 86 38 86 46 C 86 56 74 60 64 56 C 54 60 42 56 42 46 Z"
        fill="#021c15" stroke="#10b981" stroke-width="1.8" filter="url(#fan-crt-glow)"/>

  <!-- Khe mắt quyến rũ sau mặt nạ -->
  <ellipse cx="52" cy="46" rx="5" ry="2.8" fill="#a7f3d0"/>
  <ellipse cx="76" cy="46" rx="5" ry="2.8" fill="#a7f3d0"/>
  <circle cx="53" cy="46" r="1.5" fill="#021c15"/>
  <circle cx="77" cy="46" r="1.5" fill="#021c15"/>

  <!-- Nốt ruồi duyên & đôi môi ngọc bích quyến rũ -->
  <circle cx="58" cy="62" r="0.8" fill="#064e3b"/>
  <path d="M 59 66 Q 64 70 69 66" fill="none" stroke="#10b981" stroke-width="2" stroke-linecap="round"/>

  <!-- Chiếc quạt lụa ngọc bích xòe duyên dáng trước ngực (Folding Fan Emblem) -->
  <g transform="translate(64, 98)">
    <path d="M -16 6 C -18 -8 18 -8 16 6 L 0 6 Z" fill="url(#fan-silk)" stroke="#a7f3d0" stroke-width="1.5" filter="url(#fan-crt-glow)"/>
    <line x1="0" y1="6" x2="-10" y2="-4" stroke="#047857" stroke-width="1"/>
    <line x1="0" y1="6" x2="0" y2="-6" stroke="#047857" stroke-width="1"/>
    <line x1="0" y1="6" x2="10" y2="-4" stroke="#047857" stroke-width="1"/>
    <circle cx="0" cy="6" r="3" fill="#ffffff"/>
  </g>

  <!-- Rank 8 -->
  <circle cx="64" cy="116" r="10" fill="#021c15" stroke="#10b981" stroke-width="1.5"/>
  <text x="64" y="120" text-anchor="middle" fill="#a7f3d0" font-size="10" font-weight="900" font-family="serif">VIII</text>
</svg>
