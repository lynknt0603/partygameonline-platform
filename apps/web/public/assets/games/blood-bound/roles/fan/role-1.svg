<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <radialGradient id="fan-lead-bg" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="50%" stop-color="#022c22"/>
      <stop offset="100%" stop-color="#01140e"/>
    </radialGradient>
    <linearGradient id="fan-jade" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a7f3d0"/>
      <stop offset="40%" stop-color="#34d399"/>
      <stop offset="80%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <filter id="fan-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#10b981" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Khung chân dung tròn ngọc bích Đông Phương -->
  <circle cx="64" cy="64" r="60" fill="url(#fan-lead-bg)" stroke="url(#fan-jade)" stroke-width="3" filter="url(#fan-glow)"/>
  <circle cx="64" cy="64" r="54" fill="none" stroke="rgba(52, 211, 153, 0.4)" stroke-width="1.2" stroke-dasharray="3 3"/>

  <!-- Cổ áo dạ hội & hoàng bào Đông Phương dựng cao sắc xanh lục -->
  <path d="M 28 120 L 40 76 L 64 88 L 88 76 L 100 120 Z" fill="#021c15" stroke="#047857" stroke-width="1.8"/>
  <path d="M 40 76 L 18 48 L 42 74 Z" fill="#065f46" stroke="#022c22" stroke-width="1.2"/>
  <path d="M 88 76 L 110 48 L 86 74 Z" fill="#065f46" stroke="#022c22" stroke-width="1.2"/>

  <!-- Thân áo gấm thêu ngọc bích & Trâm cài phượng hoàng ngọc -->
  <path d="M 36 128 C 42 98 86 98 92 128 Z" fill="#047857" stroke="url(#fan-jade)" stroke-width="1.5"/>
  <polygon points="64,88 71,96 64,104 57,96" fill="#10b981" stroke="url(#fan-jade)" stroke-width="1.5"/>
  <circle cx="64" cy="96" r="2.5" fill="#d1fae5" opacity="0.9"/>

  <!-- Khuôn mặt Lãnh Tụ Gia Tộc Quạt thanh tú lạnh lùng -->
  <path d="M 40 54 C 38 34 50 24 64 24 C 78 24 90 34 88 54 C 92 64 86 76 86 76 C 82 66 80 60 76 58 C 64 62 52 58 48 76 C 48 76 42 64 40 54 Z"
        fill="#f1f5f9" stroke="#334155" stroke-width="1.2"/>
  <path d="M 48 50 C 48 68 54 78 64 82 C 74 78 80 68 80 50 C 80 40 74 36 64 36 C 54 36 48 40 48 50 Z"
        fill="#ecfdf5" stroke="#047857" stroke-width="1.2"/>
  <!-- Đôi mắt xanh ngọc bích phát sáng sắc lạnh -->
  <ellipse cx="56" cy="54" rx="3" ry="1.8" fill="#10b981"/>
  <circle cx="56.5" cy="53.5" r="0.8" fill="#ffffff"/>
  <ellipse cx="72" cy="54" rx="3" ry="1.8" fill="#10b981"/>
  <circle cx="72.5" cy="53.5" r="0.8" fill="#ffffff"/>

  <!-- Vương miện ngọc bích Đông Phương (Jade Crown) -->
  <path d="M 46 32 L 52 16 L 64 24 L 76 16 L 82 32 Z" fill="url(#fan-jade)" stroke="#064e3b" stroke-width="1.5" stroke-linejoin="round"/>
  <circle cx="52" cy="16" r="2" fill="#34d399"/>
  <circle cx="64" cy="24" r="2.5" fill="#ecfdf5"/>
  <circle cx="76" cy="16" r="2" fill="#34d399"/>

  <!-- Huy hiệu Rank 1 Fan Clan -->
  <circle cx="64" cy="116" r="10" fill="#021c15" stroke="#10b981" stroke-width="1.5"/>
  <text x="64" y="120" text-anchor="middle" fill="#a7f3d0" font-size="11" font-weight="900" font-family="serif">I</text>
</svg>
