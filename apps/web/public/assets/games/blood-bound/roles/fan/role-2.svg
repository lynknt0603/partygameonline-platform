<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <radialGradient id="fan-as-bg" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="50%" stop-color="#022c22"/>
      <stop offset="100%" stop-color="#01140e"/>
    </radialGradient>
    <linearGradient id="fan-as-steel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#a7f3d0"/>
      <stop offset="80%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <filter id="fan-as-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#10b981" flood-opacity="0.7"/>
    </filter>
  </defs>

  <circle cx="64" cy="64" r="60" fill="url(#fan-as-bg)" stroke="#10b981" stroke-width="3" filter="url(#fan-as-glow)"/>
  <circle cx="64" cy="64" r="54" fill="none" stroke="rgba(16, 185, 129, 0.4)" stroke-width="1.2" stroke-dasharray="4 3"/>

  <!-- Tàn ảnh ám sát xanh ngọc bích -->
  <path d="M 24 100 Q 34 80 44 94 Q 54 110 34 118 Z" fill="#03261d" opacity="0.6"/>
  <path d="M 104 100 Q 94 80 84 94 Q 74 110 94 118 Z" fill="#03261d" opacity="0.6"/>

  <!-- Áo choàng & Mũ trùm thích khách Fan Clan -->
  <path d="M 32 128 L 44 88 L 64 78 L 84 88 L 96 128 Z" fill="#021c15" stroke="#047857" stroke-width="1.5"/>
  <path d="M 64 18 C 42 18 36 34 36 58 C 36 78 44 88 64 92 C 84 88 92 78 92 58 C 92 34 86 18 64 18 Z"
        fill="#01140e" stroke="#065f46" stroke-width="2"/>

  <path d="M 44 46 C 44 34 52 30 64 30 C 76 30 84 34 84 46 C 84 64 78 78 64 80 C 50 78 44 64 44 46 Z" fill="#000000"/>
  <path d="M 46 62 Q 64 68 82 62 L 78 80 Q 64 86 50 80 Z" fill="#022119" stroke="#10b981" stroke-width="1.2"/>

  <!-- Đôi mắt xanh ngọc bích rực sáng trong bóng đêm -->
  <path d="M 48 48 Q 56 46 60 52 Q 54 52 48 48 Z" fill="#34d399" filter="url(#fan-as-glow)"/>
  <polygon points="52,48 57,48 58,51 53,51" fill="#ffffff"/>
  <path d="M 80 48 Q 72 46 68 52 Q 74 52 80 48 Z" fill="#34d399" filter="url(#fan-as-glow)"/>
  <polygon points="76,48 71,48 70,51 75,51" fill="#ffffff"/>

  <!-- Song đoản kiếm ám sát ngọc bích Fan Clan -->
  <path d="M 26 112 L 52 74 L 56 78 L 30 116 Z" fill="url(#fan-as-steel)" stroke="#10b981" stroke-width="1.2"/>
  <path d="M 102 112 L 76 74 L 72 78 L 98 116 Z" fill="url(#fan-as-steel)" stroke="#10b981" stroke-width="1.2"/>

  <!-- Rank 2 Fan Clan -->
  <circle cx="64" cy="116" r="10" fill="#01140e" stroke="#10b981" stroke-width="1.5"/>
  <text x="64" y="120" text-anchor="middle" fill="#a7f3d0" font-size="11" font-weight="900" font-family="serif">II</text>
</svg>
