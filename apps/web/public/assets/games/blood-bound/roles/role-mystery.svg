<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <radialGradient id="myst-bg" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="60%" stop-color="#0f0c29"/>
      <stop offset="100%" stop-color="#030014"/>
    </radialGradient>
    <linearGradient id="myst-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e9d5ff"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#581c87"/>
    </linearGradient>
    <filter id="myst-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#a855f7" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Khung chân dung tròn mạ thạch anh tím thần bí -->
  <circle cx="64" cy="64" r="60" fill="url(#myst-bg)" stroke="url(#myst-purple)" stroke-width="3" filter="url(#myst-glow)"/>
  <circle cx="64" cy="64" r="54" fill="none" stroke="rgba(168, 85, 247, 0.3)" stroke-width="1.2" stroke-dasharray="4 3"/>

  <!-- Tàn ảnh & Khói hắc ám huyền bí xung quanh -->
  <path d="M 28 128 L 44 86 L 64 80 L 84 86 L 100 128 Z" fill="#0f0c29" stroke="#312e81" stroke-width="1.5"/>

  <!-- Mũ trùm đầu bóng đêm huyền bí (Mystery Hood) -->
  <path d="M 64 18 C 42 18 36 32 36 56 C 36 78 44 88 64 92 C 84 88 92 78 92 56 C 92 32 86 18 64 18 Z" 
        fill="#030014" stroke="#4338ca" stroke-width="2"/>

  <!-- Hốc mặt sâu thẳm đen tuyền -->
  <path d="M 44 44 C 44 32 52 28 64 28 C 76 28 84 32 84 44 C 84 62 78 78 64 80 C 50 78 44 62 44 44 Z" 
        fill="#000000"/>

  <!-- Đôi mắt phát sáng sắc tím u linh (Glowing Amethyst Eyes) -->
  <ellipse cx="54" cy="50" rx="3.5" ry="2" fill="#c084fc"/>
  <ellipse cx="74" cy="50" rx="3.5" ry="2" fill="#c084fc"/>

  <!-- Dấu hỏi phù ấn bí mật lơ lửng phát sáng giữa mặt -->
  <g transform="translate(64, 60)" filter="url(#myst-glow)">
    <text x="0" y="8" text-anchor="middle" fill="#f3e8ff" font-size="28" font-weight="900" font-family="serif">?</text>
  </g>

  <!-- Huy hiệu chấm hỏi ở đáy -->
  <circle cx="64" cy="116" r="10" fill="#030014" stroke="url(#myst-purple)" stroke-width="1.5"/>
  <text x="64" y="120" text-anchor="middle" fill="#f3e8ff" font-size="11" font-weight="900" font-family="serif">?</text>
</svg>
