<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <radialGradient id="rose-mnt-bg" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#4c0519"/>
      <stop offset="50%" stop-color="#1f0208"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
    <linearGradient id="rose-psychic" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fecdd3"/>
      <stop offset="40%" stop-color="#f43f5e"/>
      <stop offset="80%" stop-color="#9f1239"/>
      <stop offset="100%" stop-color="#4c0519"/>
    </linearGradient>
    <filter id="rose-mnt-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#f43f5e" flood-opacity="0.65"/>
    </filter>
  </defs>

  <circle cx="64" cy="64" r="60" fill="url(#rose-mnt-bg)" stroke="#f43f5e" stroke-width="3" filter="url(#rose-mnt-glow)"/>
  <circle cx="64" cy="64" r="54" fill="none" stroke="rgba(244, 63, 94, 0.35)" stroke-width="1.2" stroke-dasharray="3 3"/>

  <!-- Áo choàng pháp sư thấu thị đỏ sẫm -->
  <path d="M 26 128 L 40 82 L 64 86 L 88 82 L 102 128 Z" fill="#24030a" stroke="#881337" stroke-width="1.5"/>

  <!-- Khăn trùm đầu bí ẩn & khuôn mặt thiền định -->
  <path d="M 38 46 C 36 24 48 16 64 16 C 80 16 92 24 90 46 C 94 62 88 74 88 74 L 40 74 C 40 74 34 62 38 46 Z"
        fill="#3b0712" stroke="#e11d48" stroke-width="1.5"/>
  <path d="M 46 48 C 46 66 52 74 64 78 C 76 74 82 66 82 48 C 82 38 76 34 64 34 C 52 34 46 38 46 48 Z"
        fill="#fce7f3" stroke="#9f1239" stroke-width="1.2"/>

  <!-- Vầng hào quang sóng tâm trí phát ra từ trán (Telepathic Waves) -->
  <path d="M 44 26 A 24 24 0 0 1 84 26" fill="none" stroke="#f43f5e" stroke-width="1.5" stroke-dasharray="2 3" opacity="0.85"/>
  <path d="M 48 20 A 20 20 0 0 1 80 20" fill="none" stroke="#fda4af" stroke-width="1.2" opacity="0.7"/>

  <!-- Con mắt thứ 3 thấu thị (All-seeing Mind Eye) giữa trán -->
  <path d="M 52 38 C 58 32 70 32 76 38 C 70 44 58 44 52 38 Z" fill="#1e0307" stroke="#f43f5e" stroke-width="1.5"/>
  <circle cx="64" cy="38" r="3.2" fill="#ff2a55" filter="url(#rose-mnt-glow)"/>
  <circle cx="65" cy="37" r="1" fill="#ffffff"/>

  <!-- Mắt thiền định thanh thản -->
  <path d="M 52 54 Q 57 58 61 54" fill="none" stroke="#881337" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M 67 54 Q 71 58 76 54" fill="none" stroke="#881337" stroke-width="1.8" stroke-linecap="round"/>

  <!-- Quả cầu thấu thị tâm linh lơ lửng trước ngực (Crystal Mind Orb) -->
  <g transform="translate(64, 98)">
    <circle cx="0" cy="0" r="14" fill="url(#rose-psychic)" stroke="#fecdd3" stroke-width="1.5" filter="url(#rose-mnt-glow)"/>
    <!-- Đồng tử nhìn thấu bên trong quả cầu -->
    <ellipse cx="0" cy="0" rx="9" ry="5" fill="#4c0519" stroke="#fda4af" stroke-width="1"/>
    <circle cx="0" cy="0" r="3" fill="#ffffff"/>
  </g>

  <!-- Rank 5 -->
  <circle cx="64" cy="116" r="10" fill="#24030a" stroke="#f43f5e" stroke-width="1.5"/>
  <text x="64" y="120" text-anchor="middle" fill="#fda4af" font-size="11" font-weight="900" font-family="serif">V</text>
</svg>
