<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <radialGradient id="rose-grd-bg" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#4c0519"/>
      <stop offset="60%" stop-color="#190207"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
    <linearGradient id="rose-steel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#cbd5e1"/>
      <stop offset="70%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <filter id="rose-grd-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#f43f5e" flood-opacity="0.6"/>
    </filter>
  </defs>

  <circle cx="64" cy="64" r="60" fill="url(#rose-grd-bg)" stroke="#f43f5e" stroke-width="3" filter="url(#rose-grd-glow)"/>
  <circle cx="64" cy="64" r="54" fill="none" stroke="rgba(244, 63, 94, 0.3)" stroke-width="1.2" stroke-dasharray="3 3"/>

  <!-- Giáp vai & Áo choàng vệ binh Rose -->
  <path d="M 22 128 L 38 82 L 64 88 L 90 82 L 106 128 Z" fill="#2a040d" stroke="#881337" stroke-width="1.5"/>
  <!-- Giáp vai thép viền đỏ -->
  <path d="M 24 96 C 24 80 40 76 44 86 Z" fill="url(#rose-steel)" stroke="#e11d48" stroke-width="1.2"/>
  <path d="M 104 96 C 104 80 88 76 84 86 Z" fill="url(#rose-steel)" stroke="#e11d48" stroke-width="1.2"/>

  <!-- Mũ giáp hiệp sĩ sắt chữ T (Knight Great Helm) -->
  <path d="M 44 26 C 44 20 52 16 64 16 C 76 16 84 20 84 26 L 84 62 C 84 76 76 84 64 86 C 52 84 44 76 44 62 Z"
        fill="url(#rose-steel)" stroke="#881337" stroke-width="2"/>

  <!-- Mào mũ nhung đỏ hoa hồng (Crimson plume) -->
  <path d="M 60 16 C 54 8 46 6 42 2 C 54 4 64 8 68 16 Z" fill="#f43f5e"/>
  <path d="M 64 16 C 60 6 52 4 48 0 C 60 2 72 6 74 16 Z" fill="#e11d48"/>

  <!-- Khe nhìn mắt chữ Thập (Cross Visor) phát sáng đỏ -->
  <line x1="48" y1="46" x2="80" y2="46" stroke="#e11d48" stroke-width="4" stroke-linecap="round"/>
  <line x1="64" y1="36" x2="64" y2="62" stroke="#e11d48" stroke-width="3" stroke-linecap="round"/>
  <line x1="52" y1="46" x2="76" y2="46" stroke="#ff2a55" stroke-width="2"/>

  <!-- Khiên hộ mệnh Rose đỏ trước ngực -->
  <path d="M 52 92 L 64 84 L 76 92 L 76 108 L 64 116 L 52 108 Z" fill="#be123c" stroke="#f43f5e" stroke-width="1.5"/>
  <circle cx="64" cy="98" r="3" fill="#ffffff"/>

  <!-- Rank 6 -->
  <circle cx="64" cy="116" r="10" fill="#2a040d" stroke="#f43f5e" stroke-width="1.5"/>
  <text x="64" y="120" text-anchor="middle" fill="#fda4af" font-size="11" font-weight="900" font-family="serif">VI</text>
</svg>
