<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <radialGradient id="rose-har-bg" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#4c0519"/>
      <stop offset="60%" stop-color="#190207"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
    <filter id="rose-har-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#f43f5e" flood-opacity="0.5"/>
    </filter>
  </defs>

  <circle cx="64" cy="64" r="60" fill="url(#rose-har-bg)" stroke="#f43f5e" stroke-width="3" filter="url(#rose-har-glow)"/>
  <circle cx="64" cy="64" r="54" fill="none" stroke="rgba(244, 63, 94, 0.3)" stroke-width="1.2" stroke-dasharray="3 3"/>

  <!-- Mũ hề nhung đỏ 2 sừng uốn cong (Rose Harlequin Horns) -->
  <path d="M 64 36 C 44 26 24 16 16 36 C 24 44 38 42 48 48 Z" fill="#be123c" stroke="#881337" stroke-width="1.5"/>
  <circle cx="16" cy="36" r="4" fill="#fb7185" stroke="#ffe4e6" stroke-width="1"/>
  <path d="M 64 36 C 84 26 104 16 112 36 C 104 44 90 42 80 48 Z" fill="#e11d48" stroke="#9f1239" stroke-width="1.5"/>
  <circle cx="112" cy="36" r="4" fill="#fb7185" stroke="#ffe4e6" stroke-width="1"/>

  <!-- Cổ áo xếp nếp dạ hội nhung đỏ -->
  <path d="M 32 128 L 48 88 L 64 96 L 80 88 L 96 128 Z" fill="#2a040d" stroke="#881337" stroke-width="1.5"/>
  <polygon points="64,92 56,104 72,104" fill="#f43f5e"/>

  <!-- Mặt nạ dạ hội Rose Mask bí ẩn -->
  <path d="M 36 50 C 36 78 46 88 64 88 C 82 88 92 78 92 50 C 92 38 78 36 64 36 C 50 36 36 38 36 50 Z" 
        fill="#fff1f2" stroke="#e11d48" stroke-width="1.8"/>

  <!-- Nửa mặt nạ họa tiết đỏ rực -->
  <path d="M 36 50 C 36 78 46 88 64 88 L 64 36 C 50 36 36 38 36 50 Z" fill="#e11d48" opacity="0.35"/>

  <!-- Hốc mắt xếch ma quái -->
  <path d="M 44 56 Q 52 48 60 56 Q 52 62 44 56 Z" fill="#1e0307"/>
  <ellipse cx="52" cy="56" rx="2.5" ry="1.5" fill="#f43f5e"/>
  <circle cx="53" cy="55.5" r="0.8" fill="#ffffff"/>

  <path d="M 68 56 Q 76 48 84 56 Q 76 62 68 56 Z" fill="#1e0307"/>
  <ellipse cx="76" cy="56" rx="2.5" ry="1.5" fill="#f43f5e"/>
  <circle cx="77" cy="55.5" r="0.8" fill="#ffffff"/>

  <!-- Nụ cười bí hiểm giọt lệ đỏ -->
  <path d="M 54 74 Q 64 80 74 74" fill="none" stroke="#be123c" stroke-width="2" stroke-linecap="round"/>
  <circle cx="48" cy="68" r="2" fill="#e11d48"/>

  <!-- Rank 3 -->
  <circle cx="64" cy="116" r="10" fill="#3b0712" stroke="#f43f5e" stroke-width="1.5"/>
  <text x="64" y="120" text-anchor="middle" fill="#fda4af" font-size="11" font-weight="900" font-family="serif">III</text>
</svg>
