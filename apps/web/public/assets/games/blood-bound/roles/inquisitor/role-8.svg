<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <radialGradient id="inqp-bg" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#78350f"/>
      <stop offset="60%" stop-color="#451a03"/>
      <stop offset="100%" stop-color="#1a0601"/>
    </radialGradient>
    <linearGradient id="inqp-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="40%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#92400e"/>
    </linearGradient>
    <filter id="inqp-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#f59e0b" flood-opacity="0.65"/>
    </filter>
  </defs>

  <!-- Khung chân dung tròn mạ vàng Phán Quyết -->
  <circle cx="64" cy="64" r="60" fill="url(#inqp-bg)" stroke="url(#inqp-gold)" stroke-width="3.5" filter="url(#inqp-glow)"/>
  <circle cx="64" cy="64" r="54" fill="none" stroke="rgba(245, 158, 11, 0.35)" stroke-width="1.2" stroke-dasharray="3 3"/>

  <!-- Vòng hào quang phán xét thần thánh (Divine Radiant Halo) -->
  <circle cx="64" cy="24" r="15" fill="none" stroke="url(#inqp-gold)" stroke-width="2"/>
  <circle cx="64" cy="24" r="12" fill="rgba(254, 240, 138, 0.25)"/>

  <!-- Mũ giáo hoàng / Khăn trùm phán quan Gothic (Inquisitor Mitre & Cowl) -->
  <path d="M 64 12 L 80 34 L 84 74 L 64 88 L 44 74 L 48 34 Z" fill="#2d1205" stroke="url(#inqp-gold)" stroke-width="1.8"/>
  <path d="M 64 16 L 76 34 L 64 42 L 52 34 Z" fill="#451a03"/>
  <polygon points="64,22 66,28 72,28 67,32 69,38 64,34 59,38 61,32 56,28 62,28" fill="#fef08a"/>

  <!-- Áo choàng tu sĩ phán quan màu vàng cam sẫm & đai vàng -->
  <path d="M 32 128 L 46 88 L 64 84 L 82 88 L 96 128 Z" fill="#78350f" stroke="#b45309" stroke-width="1.5"/>
  <path d="M 52 86 L 50 128 L 60 128 L 58 86 Z" fill="#fef3c7" stroke="url(#inqp-gold)" stroke-width="1"/>
  <path d="M 76 86 L 78 128 L 68 128 L 70 86 Z" fill="#fef3c7" stroke="url(#inqp-gold)" stroke-width="1"/>

  <!-- Khuôn mặt Phán Quan trang nghiêm -->
  <path d="M 50 48 C 50 64 56 74 64 78 C 72 74 78 64 78 48 C 78 42 72 38 64 38 C 56 38 50 42 50 48 Z"
        fill="#fef08a" opacity="0.95"/>

  <!-- Dải băng bịt mắt công lý -->
  <rect x="46" y="52" width="36" height="8" rx="2" fill="#fffbeb" stroke="#b45309" stroke-width="1.2"/>
  <circle cx="64" cy="56" r="2.2" fill="#d97706"/>

  <line x1="60" y1="70" x2="68" y2="70" stroke="#78350f" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Biểu tượng Cán Cân Công Lý trên ngực -->
  <g transform="translate(64, 102)">
    <line x1="-12" y1="0" x2="12" y2="0" stroke="url(#inqp-gold)" stroke-width="1.8"/>
    <line x1="0" y1="-6" x2="0" y2="12" stroke="url(#inqp-gold)" stroke-width="1.8"/>
    <path d="M -12 2 L -15 8 L -9 8 Z" fill="#fde047"/>
    <path d="M 12 2 L 9 8 L 15 8 Z" fill="#fde047"/>
  </g>

  <!-- Huy hiệu Rank 8 ở đáy -->
  <circle cx="64" cy="116" r="10" fill="#451a03" stroke="url(#inqp-gold)" stroke-width="1.5"/>
  <text x="64" y="120" text-anchor="middle" fill="#fef08a" font-size="10" font-weight="900" font-family="serif">VIII</text>
</svg>
