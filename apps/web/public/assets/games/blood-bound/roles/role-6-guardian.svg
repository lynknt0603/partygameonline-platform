<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <radialGradient id="guard-bg" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="60%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>
    <linearGradient id="guard-steel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="30%" stop-color="#cbd5e1"/>
      <stop offset="70%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="guard-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#a16207"/>
    </linearGradient>
    <filter id="guard-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#38bdf8" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Khung chân dung tròn mạ thép Hiệp Sĩ -->
  <circle cx="64" cy="64" r="60" fill="url(#guard-bg)" stroke="url(#guard-gold)" stroke-width="3" filter="url(#guard-glow)"/>
  <circle cx="64" cy="64" r="54" fill="none" stroke="rgba(56, 189, 248, 0.3)" stroke-width="1.2" stroke-dasharray="3 3"/>

  <!-- Giáp vai sắt đồ sộ (Pauldron Plates) -->
  <path d="M 22 128 C 24 94 48 88 56 96 L 64 102 L 72 96 C 80 88 104 94 106 128 Z"
        fill="url(#guard-steel)" stroke="#1e293b" stroke-width="2"/>
  <rect x="52" y="94" width="24" height="6" rx="2" fill="url(#guard-gold)"/>

  <!-- Mũ giáp sắt Hiệp Sĩ Gothic (Great Helm with Visor) -->
  <path d="M 64 16 C 44 16 38 28 38 52 C 38 78 46 88 64 90 C 82 88 90 78 90 52 C 90 28 84 16 64 16 Z"
        fill="url(#guard-steel)" stroke="#1e293b" stroke-width="2"/>

  <!-- Vành mào lông mũ giáp mạ vàng (Knight's Crest) -->
  <path d="M 64 12 L 68 28 L 60 28 Z" fill="url(#guard-gold)"/>
  <path d="M 52 14 Q 64 6 76 14 L 72 20 Q 64 14 56 20 Z" fill="#e11d48"/>

  <!-- Tấm chắn che mặt & khe nhìn thép (Visor Slits) -->
  <path d="M 44 48 L 84 48 L 82 72 L 64 80 L 46 72 Z" fill="#1e293b" stroke="url(#guard-gold)" stroke-width="1.5"/>
  <!-- Khe thở & khe mắt chữ T phát sáng ánh xanh hộ vệ -->
  <line x1="50" y1="54" x2="78" y2="54" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="64" y1="54" x2="64" y2="72" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
  <circle cx="56" cy="64" r="1" fill="#cbd5e1"/>
  <circle cx="72" cy="64" r="1" fill="#cbd5e1"/>

  <!-- KHIÊN HỘ MỆNH PHÁT SÁNG CẦM PHÍA TRƯỚC (Aegis Shield) -->
  <g transform="translate(64, 102)">
    <path d="M -16 -12 L 16 -12 L 14 12 L 0 20 L -14 12 Z" fill="url(#guard-steel)" stroke="url(#guard-gold)" stroke-width="1.5"/>
    <path d="M -10 -8 L 10 -8 L 8 8 L 0 14 L -8 8 Z" fill="#0284c7" opacity="0.8"/>
    <polygon points="0,-4 3,2 0,6 -3,2" fill="#ffffff"/>
  </g>

  <!-- Huy hiệu Rank 6 ở đáy -->
  <circle cx="64" cy="116" r="10" fill="#0f172a" stroke="url(#guard-gold)" stroke-width="1.5"/>
  <text x="64" y="120" text-anchor="middle" fill="#fef08a" font-size="10" font-weight="900" font-family="serif">VI</text>
</svg>
