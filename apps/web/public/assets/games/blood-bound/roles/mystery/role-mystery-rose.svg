      <stop offset="100%" stop-color="#090103"/>
    </radialGradient>
    <filter id="myst-rose-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#f43f5e" flood-opacity="0.6"/>
    </filter>
  </defs>

  <circle cx="64" cy="64" r="60" fill="url(#myst-rose-bg)" stroke="#f43f5e" stroke-width="2.5" filter="url(#myst-rose-glow)"/>
  <circle cx="64" cy="64" r="54" fill="none" stroke="rgba(244, 63, 94, 0.3)" stroke-width="1.2" stroke-dasharray="3 3"/>

  <!-- Bóng đen trùm đầu Rose -->
  <path d="M 32 128 C 36 94 48 84 64 84 C 80 84 92 94 96 128 Z" fill="#180206" stroke="#881337" stroke-width="1.5"/>
  <path d="M 64 22 C 44 22 38 38 38 60 C 38 80 46 88 64 92 C 82 88 90 80 90 60 C 90 38 84 22 64 22 Z"
        fill="#130104" stroke="#e11d48" stroke-width="1.8"/>
  <path d="M 44 48 C 44 38 52 34 64 34 C 76 34 84 38 84 48 C 84 66 78 78 64 80 C 50 78 44 66 44 48 Z" fill="#050001"/>

  <!-- Mắt đỏ hoa hồng mờ ảo -->
  <ellipse cx="54" cy="54" rx="2.5" ry="1.5" fill="#f43f5e" opacity="0.9"/>
  <ellipse cx="74" cy="54" rx="2.5" ry="1.5" fill="#f43f5e" opacity="0.9"/>

  <!-- Biểu tượng hoa hồng đỏ bí ẩn giữa ngực -->
