<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <radialGradient id="inq-bg-grad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#451a03"/>
      <stop offset="60%" stop-color="#240c02"/>
      <stop offset="100%" stop-color="#0c0401"/>
    </radialGradient>
    <linearGradient id="inq-gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="30%" stop-color="#fde047"/>
      <stop offset="70%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="inq-blade-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="inq-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#f59e0b" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Huy hiệu tròn Phán Quyết Hoàng Kim -->
  <circle cx="64" cy="64" r="59" fill="url(#inq-bg-grad)" stroke="url(#inq-gold-grad)" stroke-width="3.5" filter="url(#inq-glow)"/>
  <circle cx="64" cy="64" r="53" fill="none" stroke="rgba(245, 158, 11, 0.4)" stroke-width="1.5" stroke-dasharray="4 3"/>

  <!-- Vòng hào quang Thái Dương thần thánh (Divine Sunburst Halo) -->
  <circle cx="64" cy="22" r="14" fill="none" stroke="url(#inq-gold-grad)" stroke-width="1.8" opacity="0.85"/>
  <circle cx="64" cy="22" r="11" fill="rgba(254, 240, 138, 0.15)"/>
  <line x1="64" y1="4" x2="64" y2="9" stroke="#fde047" stroke-width="1.5"/>
  <line x1="77" y1="9" x2="73" y2="13" stroke="#fde047" stroke-width="1.5"/>
  <line x1="51" y1="9" x2="55" y2="13" stroke="#fde047" stroke-width="1.5"/>

  <!-- ĐÔI CÁNH THIÊN SỨ PHÁN XÉT (Seraphic Wings of Verdict) -->
  <!-- Cánh trái -->
  <path d="M 46 48 C 22 42 12 56 16 72 C 26 74 38 66 46 58 Z" fill="#ffffff" stroke="#b45309" stroke-width="1.5"/>
  <path d="M 22 66 C 30 72 38 66 46 58 L 40 52 C 30 58 26 62 22 66 Z" fill="#fde68a"/>
  <path d="M 28 54 C 20 62 26 70 32 70" fill="none" stroke="#d97706" stroke-width="1.2"/>
  <!-- Cánh phải -->
  <path d="M 82 48 C 106 42 116 56 112 72 C 102 74 90 66 82 58 Z" fill="#ffffff" stroke="#b45309" stroke-width="1.5"/>
  <path d="M 106 66 C 98 72 90 66 82 58 L 88 52 C 98 58 102 62 106 66 Z" fill="#fde68a"/>
  <path d="M 100 54 C 108 62 102 70 96 70" fill="none" stroke="#d97706" stroke-width="1.2"/>

  <!-- THANH KIẾM CÔNG LÝ ĐỨNG TRỰC DIỆN TẠI TÂM (Sword of Impartial Justice) -->
  <path d="M 64 22 L 67 86 L 64 92 L 61 86 Z" fill="url(#inq-blade-grad)" stroke="#78350f" stroke-width="1.5"/>
  <line x1="64" y1="22" x2="64" y2="88" stroke="#ffffff" stroke-width="1"/>
  <!-- Chuôi kiếm hình thánh giá mạ vàng -->
  <rect x="52" y="32" width="24" height="4" rx="1.5" fill="url(#inq-gold-grad)" stroke="#78350f" stroke-width="1"/>
  <circle cx="64" cy="34" r="3" fill="#dc2626" stroke="#78350f" stroke-width="0.8"/>

  <!-- CÁN CÂN CÔNG LÝ HAI BÊN (Golden Scales of Judgment) -->
  <!-- Đòn cân ngang -->
  <path d="M 24 46 L 104 46 L 100 50 L 28 50 Z" fill="url(#inq-gold-grad)" stroke="#78350f" stroke-width="1.5"/>

  <!-- Dây xích đĩa cân trái -->
  <line x1="30" y1="50" x2="20" y2="80" stroke="#d97706" stroke-width="1.5"/>
  <line x1="38" y1="50" x2="48" y2="80" stroke="#d97706" stroke-width="1.5"/>
  <!-- Đĩa cân trái -->
  <path d="M 16 80 C 16 94 52 94 52 80 Z" fill="url(#inq-gold-grad)" stroke="#78350f" stroke-width="1.5"/>
  <ellipse cx="34" cy="80" rx="18" ry="4" fill="#fef08a" stroke="#78350f" stroke-width="1"/>

  <!-- Dây xích đĩa cân phải -->
  <line x1="90" y1="50" x2="80" y2="80" stroke="#d97706" stroke-width="1.5"/>
  <line x1="98" y1="50" x2="108" y2="80" stroke="#d97706" stroke-width="1.5"/>
  <!-- Đĩa cân phải -->
  <path d="M 76 80 C 76 94 112 94 112 80 Z" fill="url(#inq-gold-grad)" stroke="#78350f" stroke-width="1.5"/>
  <ellipse cx="94" cy="80" rx="18" ry="4" fill="#fef08a" stroke="#78350f" stroke-width="1"/>

  <!-- Ngọn lửa thánh trong hai đĩa cân -->
  <path d="M 34 78 Q 38 68 34 64 Q 30 68 34 78 Z" fill="#ef4444"/>
  <path d="M 34 76 Q 36 70 34 67 Q 32 70 34 76 Z" fill="#fbbf24"/>
  <path d="M 94 78 Q 98 68 94 64 Q 90 68 94 78 Z" fill="#ef4444"/>
  <path d="M 94 76 Q 96 70 94 67 Q 92 70 94 76 Z" fill="#fbbf24"/>

  <!-- Ruy băng phù hiệu chữ INQUISITOR phía dưới -->
  <g transform="translate(64, 114)">
    <path d="M -36 -6 L 36 -6 L 30 6 L -30 6 Z" fill="#200a02" stroke="url(#inq-gold-grad)" stroke-width="1.2"/>
    <text y="3" text-anchor="middle" fill="#fde68a" font-size="6.5" font-weight="900" letter-spacing="1.5" font-family="serif">INQUISITOR</text>
  </g>
</svg>
