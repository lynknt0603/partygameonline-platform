<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0B0D10" />
    <meta
      name="description"
      content="Party Game Online — online tabletop & party game platform."
    />
    <title>Party Game Online</title>
    <!--
      Intentionally duplicated from theme.storage.ts / theme.dom.ts.
      This script must run before the React bundle so the first paint already
      has the correct data-theme. useEffect / Zustand module side-effects
      cannot prevent FOUC.
    -->
    <script>
      (function () {
        try {
          var KEY = "boardverse_theme_preference";
          var stored = null;
          try {
            stored = localStorage.getItem(KEY);
          } catch (e) {}
          var mode =
            stored === "system" || stored === "light" || stored === "dark"
              ? stored
              : "system";
          var systemDark = false;
          try {
            systemDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
          } catch (e) {}
          var resolved = mode === "system" ? (systemDark ? "dark" : "light") : mode;
          document.documentElement.setAttribute("data-theme", resolved);
          var color = resolved === "dark" ? "#0B0D10" : "#F5F7F3";
          var meta = document.querySelector('meta[name="theme-color"]');
          if (!meta) {
            meta = document.createElement("meta");
            meta.setAttribute("name", "theme-color");
            document.head.appendChild(meta);
          }
          meta.setAttribute("content", color);
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "dark");
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
